[build-system]
requires = ["setuptools >= 77.0.3", "setuptools-scm >= 10.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bgtl-fluxy"
description = "Biogeotrace Lab's Fluxy: A command-line suite for flux processing excellence"
authors = [
    {name="Iosif Doundoulakis", email="iosif.doundoulakis@uab.cat"},
]
maintainers = [
    {name="Iosif Doundoulakis", email="iosif.doundoulakis@uab.cat"},
    {email="iosif.doundoulakis@outlook.com"}
]
dynamic = ["version"]
requires-python = ">= 3.11"
dependencies = [
"pandas",
"click",
"pyyaml",
"simpleeval",
"colorama"
]

readme = "README.md"
keywords = ["eddy", "covariance"]
license = { text = "" }

[project.urls]
homepage = "https://biogeotrace.com/fluxy"
documentation = "https://biogeotrace.com/fluxy"
repository = "https://github.com/Biogeotrace-Lab/bgtl-flux-processing"
issues = "https://github.com/Biogeotrace-Lab/bgtl-flux-processing/issues"
changelog = "https://github.com/Biogeotrace-Lab/bgtl-flux-processing/blob/main/CHANGELOG.md"
org = "https://biogeotrace.com"

[project.scripts]
fluxy = "fluxy._cli:main"

[tool.setuptools_scm]
write_to = "src/fluxy/_version.py"

[project.optional-dependencies]
dev = [
    "git-cliff",
    "black",
]

docs = [
    "sphinx",
    "myst-parser",
    "pydata-sphinx-theme",
    "sphinx-copybutton",
    "sphinx-inline-tabs",
    "sphinx-autobuild",
    "sphinx-click"
]

