[build-system]
requires = ["setuptools >= 77.0.3", "setuptools-scm >= 10.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bgtl-fluxy"
description = "Biogeotrace Lab's Fluxy: A command-line suite for flux processing excellence"
authors = [
    {name="Iosif Doundoulakis", email="iosif.doundoulakis@uab.cat"},
]
maintainers = [
    {name="Iosif Doundoulakis", email="iosif.doundoulakis@uab.cat"},
    {email="iosif.doundoulakis@outlook.com"}
]
dynamic = ["version"]
requires-python = ">= 3.11"
dependencies = [
"pandas",
"click",
"pyyaml",
"simpleeval",
]
readme = "README.md"
keywords = []
license = { text = "" }

[project.urls]
# homepage = ""
# documentation = ""
# repository = ""
# issues = ""
# changelog = ""

[project.scripts]
fluxy = "fluxy._cli:main"

[tool.setuptools_scm]
write_to = "src/fluxy/_version.py"
