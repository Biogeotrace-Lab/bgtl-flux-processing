# Site code.
site: LN

# Data loading section.
read_csv_opts:
  - header: 0
    parse_dates: ["TIMESTAMP"]
    index_col: "TIMESTAMP"
    na_values: ["-99999", "99999", "-9999", "9999", "-6999", "-7777", "NA", "NAN"]
  - header: 1
    skiprows: [2, 3]
    parse_dates: ["TIMESTAMP"]
    index_col: "TIMESTAMP"
    na_values: ["-99999", "99999", "-9999", "9999", "-6999", "-7777", "NA", "NAN"]
  - header: 0
    na_values: ["-99999", "99999", "-9999", "9999", "-6999", "-7777", "NA", "NAN"]
    parse_dates: null
    index_col: null

# Calibrations section.
calibrations:
  2020-01-01 00:00:00:
    TA_Avg:
      lower: -10
      upper: 50
    RH_Avg:
      lower: 1
      upper: 100
    PA:
      lower: 85
      upper: 105
    PAR_1_Avg:
      scalar: 1000/6.64
      lower: -5
      upper: 3000
    PAR_2_Avg:
      scalar: -1000/6.47
      lower: -5
      upper: 3000
    SW_IN_Avg:
      scalar: 1000/13.20
      lower: -150
      upper: 1500
    SW_OUT_Avg:
      scalar: 1000/13.04
      lower: -150
      upper: 3000
    LW_IN_Avg:
      scalar: 1000/10.15
      offset: 5.67 * 10**-8 * (CNR4TC_Avg + 273.15) ** 4
      lower: -150
      upper: 1500
    LW_OUT_Avg:
      scalar: 1000/10.49
      offset: 5.67 * 10**-8 * (CNR4TC_Avg + 273.15) ** 4
      lower: -200
      upper: 200
    SHF_1_Avg:
      scalar: 1000/62.12
      lower: -250
      upper: 350
    SHF_2_Avg:
      scalar: 1000/63.89
      lower: -250
      upper: 350
    SHF_3_Avg:
      scalar: 1000/63.86
      lower: -250
      upper: 350

# Known periods of tower downtime.
offline_periods:
  - []

L0: # L0 processing: data collection and column mapping.
  Date:
  Time:
  Diagnostic Value:
    name: Diag75
    units: ''
    range: [0, 255]
  CO2 (mmol/m^3):
    name: C
    units: mmol/m^3
    range: [0, 50]
  H2O (mmol/m^3):
    name: Q
    units: mmol/m^3
    range: [0, 2000]
  Temperature (C):
    name: T_li75
    units: C
    range: [-10, 70]
  Pressure (kPa):
    name: P_li75
    units: Kpa
    range: [90,  120]
  Cooler Voltage (V):
    name: Cooler
    units: V
    range: [0,   5]
  Dew Point (C):
    name: Tdew
    units: C
    range: [-40, 70] 
  CO2 Signal Strength:
    name: SS
    units: "%"
    range: [0,   108]
  U (m/s):
    name: U
    units: m/s
    range: [-50, 50] 
  V (m/s):
    name: V
    units: m/s
    range: [-50, 50] 
  W (m/s):
    name: W
    units: m/s
    range: [-20, 20] 
  T (C):
    name: Ts
    units: C
    range: [-5,  50] 
  CH4 Temperature:
    name: T_li77
    units: C
    range: [-10, 70] 
  CH4 Pressure:
    name: P_li77
    units: Kpa
    range: [90,  120]
  CH4 Signal Strength:
    name: RSSI
    units: "%"
    range: [0,   100]
  CH4 Diagnostic Value:
    name: Diag77
    units: ''
    range: [null, null]
  CH4 Drop Rate (%):
    name: Drop
    units: '%'
    range: [0, 100]
