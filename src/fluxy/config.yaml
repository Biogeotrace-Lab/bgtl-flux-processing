name: Rietvell

# Default configurations for meteorological data.
read_csv_opts: &read_csv_opts
  header: 1
  skiprows: [2, 3]
  parse_dates: ["TIMESTAMP"]
  index_col: "TIMESTAMP"
  na_values: [-99999, 99999, -9999, 9999, -6999, -7777, "NA", "NAN"]

# Required information for converting
# volt measurements into meteorological units
# per declared time period.
volt_conversions:
  # Template
  # - START_DATE:
  #     var_1:
  #       ...
  #     ...
  - "2025-01-01T00:00:00":
      TA_Avg:
        scalar: 1
        lower: -10
        upper: 50
      RH_Avg:
        scalar: 1
        lower: 1
        upper: 100
      PA:
        scalar: 1
        lower: 85
        upper: 105
      PAR_IN:
        scalar: 151.74506828528072
        offset: 0
        lower: -5
        upper: 3000
      PAR_OUT:
        scalar: 150.60240963855424
        offset: 0
        lower: -5
        upper: 3000
      SW_IN:
        scalar: 75.35795026375283
        offset: 0
        lower: -150
        upper: 1500
      SW_OUT:
        scalar: 94.33962264150944
        offset: 0
        lower: -150
        upper: 3000
      LW_IN:
       scalar: 105.70824524312896
       offset: 0
       lower: -150
       upper: 1500
      LW_OUT:
        scalar: 108.10810810810811
        offset: 0
        lower: -200
        upper: 200
      SW_IN_NR01:
        scalar: 69.44444444444444
      SW_OUT_NR01:
        scalar: 60.24096385542168
      LW_IN_NR01:
        scalar: 88.49557522123894
      LW_OUT_NR01:
        scalar: 86.20689655172414
  -

# Known periods when the site was inaccessible.
offline_periods:
  - start_date: ""
    end_date: ""

---

name: Alfacada
read_csv_opts: *read_csv_opts

