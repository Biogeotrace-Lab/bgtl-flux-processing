# YAML configuration file for flux processing.

# Default configurations for CSV file reading.
# The options provided to pandas.read_csv.
# Uses the first configuration that succeeds.
read_csv_opts:
  # Example
  # - header: 0
  #   parse_dates: ["TIMESTAMP"]
  #   index_col: "TIMESTAMP"
  #   na_values: [-99999, 99999, -9999, 9999, -6999, -7777, "NA", "NAN"]

# Conversions section
conversions:
  # Example
  # Conversions have starting dates.
  # From 1970-01-01 00:00:00 to 1980-01-01 00:00:00 of timeseries (exclusive),
  # scale and clip Variable 1 as follows:
  # 1970-01-01 00:00:00: Start of period 1.
  #   Variable 1:
  #     scalar: 1
  #     offset: 1
  #     lower: 1
  #     upper: 1
  #   Variable 2: ...
  # From 1980-01-01 00:00:00 to end of timeseries scale and clip Variable 1, 2
  # as follows:
  # 1980-01-01 00:00:00: End of period 1.
  #   Variable 1:
  #     scalar: 2
  #     offset: 2
  #     lower: 2
  #     upper: 2
  #   Variable 2: ...

# Known periods when the site was inaccessible.
offline_periods:
  # Example
  # - [1971-04-01 17:30:00, 1971-04-30 15:00:00]
